# The context-data catalogue (ADR-0011): economic and market series that ground analysis, each a verified free
# route (recon 2026-11-07: docs/sources/context_br.md, docs/sources/context_global.md). Reviewed like code.
#
# One [[file]] = one request shape, archived by `ingest/context.py`:
#   source, dataset   registry source_id and dataset_id ("{key}" / "{year}" expand)
#   url               "{key}" from `keys`, "{year}" from first_year..this year, "{since}" (incremental start)
#   ext               raw extension; params / incremental (extra params outside backfill, may use "{since}")
#   every_days        re-request cadence for the daily job (a year below the current one: backfill only)
#   browser           true when the host resets non-browser clients
#   about             what it is, unit, first date (en)

# ---------------------------------------------------------------- Brazil: BCB SGS (monthly; whole history per call)
[[file]]
source = "bcb_sgs"
dataset = "sgs_{key}"
url = "https://api.bcb.gov.br/dados/serie/bcdata.sgs.{key}/dados"
params = { formato = "json" }
ext = "json"
every_days = 7
about = "monthly SGS series (codes in keys): Selic month, IPCA and cores, IGP, IBC-Br, fiscal, external, credit, money"
keys = [
  "4390", "4189",                                                   # Selic accumulated in the month, annualised
  "433", "7478", "188", "189", "190",                               # IPCA, IPCA-15, INPC, IGP-M, IGP-DI % m/m
  "4466", "11426", "11427", "16121", "16122", "21379",              # IPCA cores, diffusion
  "11428", "4449", "4447", "4448", "10844", "10841", "10842", "10843",  # free/monitored/tradables/services/goods
  "24363", "24364", "29601", "29603", "29605",                      # IBC-Br NSA/SA, agro/industry/services
  "24369",                                                          # PNAD unemployment (rolling quarter)
  "5793", "4649", "5727", "4583", "4513", "4478", "4536", "13762",  # fiscal: primary, nominal, DLSP, DBGG
  "22701", "24419", "23079", "22707", "22864", "22885", "3546", "11752",  # external
  "20539", "20542", "20622", "21082", "21083", "21084", "20714", "27631", "27634", "29037", "29034",  # credit
  "1788", "27791", "27810", "27813", "27815",                       # money
]

# daily SGS series beyond CDI/Selic (bcb_sgs connector handles 10-year windows for these): see alternates.BcbSgs

