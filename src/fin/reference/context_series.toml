# ---------------------------------------------------------------- Brazil: BCB Copom history, BCB Focus
[[file]]
source = "bcb_copom"
dataset = "historico_taxas_juros"
url = "https://www.bcb.gov.br/api/servico/sitebcb/historicotaxasjuros"
ext = "json"
every_days = 1
browser = true
about = "every Copom meeting since 1996-06-26: date, bias, Selic target, effective Selic in force"

[[file]]
source = "bcb_focus"
dataset = "{key}"
url = "https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/{key}"
params = { "$format" = "json", "$filter" = "Data ge '{year}-01-01' and Data le '{year}-12-31'" }
first_year = 2000
ext = "json"
every_days = 7
about = "Focus survey by survey date (knowledge time is natural): annual, monthly, quarterly, Selic per meeting, 12/24m inflation, Top 5"
keys = [
  "ExpectativasMercadoAnuais", "ExpectativaMercadoMensais", "ExpectativasMercadoTrimestrais",
  "ExpectativasMercadoSelic", "ExpectativasMercadoInflacao12Meses", "ExpectativasMercadoInflacao24Meses",
  "ExpectativasMercadoTop5Anuais", "ExpectativasMercadoTop5Selic",
]

