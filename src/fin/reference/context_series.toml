  "t/1736/n1/all/v/2289,44,2292/p/all",            # INPC; 1979-03-
  "t/7060/n1/all/v/63,66/p/all/c315/all",          # IPCA groups/items, % and weights; 2020-01-
  "t/1620/n1/all/v/583/p/all/c11255/90707",        # GDP volume index NSA; 1996Q1-
  "t/1621/n1/all/v/584/p/all/c11255/90707",        # GDP volume index SA
  "t/5932/n1/all/v/6564,6561/p/all/c11255/90707",  # GDP q/q SA, y/y
  "t/8888/n1/all/v/12606,12607/p/all/c544/129314", # industrial production; 2002-01-
  "t/8880/n1/all/v/7169,7170/p/all/c11046/56734",  # retail volume; 2000-01-
  "t/5906/n1/all/v/7167,7168/p/all/c11046/56726",  # services volume; 2011-01-
  "t/6381/n1/all/v/4099/p/all",                    # unemployment, rolling quarter; 2012-03-
