# The source registry (PLAN §4.3.1 `source_registry`). Reviewed like code.
# tier: P primary/official, S secondary reputable, U unofficial (never feeds L3 alone, PLAN §4.4).
# ephemeral: the source serves only today or a short window; it is archived daily (PLAN §4.1 invariant 13).
# status: recon (note exists, no connector) | archiving (raw archived, not parsed yet) | parsed (L2 loaded)
# Every recon path must exist (scripts/check_docs.py).

